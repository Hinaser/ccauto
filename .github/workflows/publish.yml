name: publish

# Publishing is driven by tags: `git tag v0.2.0 && git push --tags`.
# The tag has to agree with package.json, and the tests have to pass on both
# platforms, before anything reaches the registry.
on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No dependencies, so there is nothing to install.
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older one.
      - run: npm install -g npm@latest

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Refuse to republish an existing version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "ccauto@$pkg" version >/dev/null 2>&1; then
            echo "::error::ccauto@$pkg is already on the registry; versions are immutable"
            exit 1
          fi

      - run: npm publish --provenance
        # With trusted publishing configured on npmjs.com for this repo and
        # workflow, no token is needed. If you use a token instead, add
        # NPM_TOKEN to the repository secrets and uncomment:
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
